---
- name: Install python3-debian for deb822 repositories
  ansible.builtin.apt:
    name: python3-debian
    state: present
  tags:
    - trivy
    - repository

- name: Remove legacy Trivy APT source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/aquasecurity_github_io_trivy_repo_deb.list
    - /etc/apt/sources.list.d/aquasecurity_github_io_trivy_repo_deb.list.disabled
  tags:
    - trivy
    - repository

- name: Install Trivy APT repository
  ansible.builtin.deb822_repository:
    name: trivy
    types: deb
    uris: "{{ trivy_repo_url }}"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "{{ trivy_key_url }}"
  register: trivy_repo
  tags:
    - trivy
    - repository

- name: Remove legacy Trivy key files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/trivy.gpg
    - /etc/apt/keyrings/trivy.gpg~
  when: item != trivy_repo.key_filename | default('')
  tags:
    - trivy
    - repository

- name: Refresh APT cache after Trivy repository change
  ansible.builtin.apt:
    update_cache: true
  when: trivy_repo is changed
  tags:
    - trivy
    - repository

- name: Install Trivy OCI security scanner
  ansible.builtin.apt:
    name:
      - trivy
  tags:
    - trivy

- name: Extract and install syft generating SBOMs for container images
  ansible.builtin.unarchive:
    src: "{{ syft_url }}"
    dest: /usr/local/bin
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  tags:
    - syft

- name: Dive for container image investigation
  ansible.builtin.apt:
    deb: "https://github.com/wagoodman/dive/releases/download/v{{ dive_version }}/dive_{{ dive_version }}_{{ system_os }}_{{ system_arch }}.deb"
  tags:
    - dive

- name: Extract and install hadolint
  ansible.builtin.get_url:
    url: "{{ hadolint_url }}"
    dest: /usr/local/bin/hadolint
    checksum: "{{ hadolint_checksum  }}"
    owner: root
    group: root
    mode: "0755"
  tags:
    - hadolint
