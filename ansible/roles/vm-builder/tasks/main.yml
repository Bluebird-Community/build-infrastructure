---
- name: Install python3-debian for deb822 repositories
  ansible.builtin.apt:
    name: python3-debian
    state: present
  tags:
    - packer
    - repository

- name: Remove legacy HashiCorp APT source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/apt_releases_hashicorp_com.list
    - /etc/apt/sources.list.d/apt_releases_hashicorp_com.list.disabled
  tags:
    - packer
    - repository

- name: Install HashiCorp APT repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: "{{ packer_repo_url }}"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "{{ packer_key_url }}"
  register: packer_repo
  tags:
    - packer
    - repository

- name: Remove legacy HashiCorp key files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/packer.gpg
    - /etc/apt/keyrings/packer.gpg~
  when: item != packer_repo.key_filename | default('')
  tags:
    - packer
    - repository

- name: Refresh APT cache after HashiCorp repository change
  ansible.builtin.apt:
    update_cache: true
  when: packer_repo is changed
  tags:
    - packer
    - repository

- name: Install Packer
  ansible.builtin.apt:
    install_recommends: false
    name:
      - packer
      - qemu-system-x86
      - qemu-utils
  tags:
    - packer
