---
timezone: UTC
# OpenJDK is a required for every component OpenNMS is running on and should be the same JDK version
system_filelimit: 1048576
system_arch: amd64
system_os: linux
system_manage_hosts_file: false
system_manage_dns: false
system_sysctl_file: /etc/sysctl.d/90-cicd-runner.conf

dns:
  primary: 193.110.81.0
  secondary: 185.253.5.0

cicd_user: cicd
cicd_group: cicd
cicd_home: /home/{{ cicd_user }}
